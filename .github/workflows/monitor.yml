name: Web Monitor

on:
  schedule:
    # 每小时检查一次（Playwright 每次耗时约 40 秒，每小时一次最稳妥，每月仅消耗约 500 分钟免费额度）
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and browser
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Run monitor script
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: python monitor.py

      - name: Commit and push if state changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_state.json
          git diff --staged --quiet || (git commit -m "Update website monitor state" && git push)
